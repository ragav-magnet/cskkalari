    <script>
      // After a new deployment, files from the previous build no longer exist, and for
      // a few seconds the new ones may not be ready. Retry a few times, with a limit,
      // instead of showing a blank page.
      (function () {
        var scheduled = false
        function retry(e) {
          if (scheduled) return
          try {
            var saved = JSON.parse(sessionStorage.getItem('asset-reload') || '{}')
            var tries = Date.now() - (saved.t || 0) < 60000 ? saved.n || 0 : 0
            if (tries >= 5) return
            sessionStorage.setItem('asset-reload', JSON.stringify({ n: tries + 1, t: Date.now() }))
          } catch (err) {
            return
          }
          scheduled = true
          if (e.type === 'vite:preloadError') e.preventDefault()
          setTimeout(function () { location.reload() }, tries === 0 ? 300 : 3000)
        }
        window.addEventListener('vite:preloadError', retry)
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) retry(e)
        }, true)
      })()
    </script>
